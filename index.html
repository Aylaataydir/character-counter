<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Frontend Mentor | Character counter</title>
</head>

<body>

  <header>
    <img class="logo" src="assets/images/logo-dark-theme.svg" alt="">
    <img class="icon icon-sun" src="assets/images/icon-sun.svg" alt="">
    <img class="icon icon-moon" src="assets/images/icon-moon.svg" alt="">
  </header>

  <main>
    <h1 class="title">Analyze your text in real-time.</h1>

    <!-- form  -->

    <form action="">
      <textarea name="" id="textarea" placeholder="Start typing here… (or paste your text)"
        spellcheck="false"></textarea>
      <div class="options">
        <div class="checkboxes">
          <div class="space">
            <input id="space" type="checkbox" value="Exclude-Spaces">
            <label for="space">Exclude Spaces</label>
          </div>
          <div class="character-limit">
            <input id="limit" type="checkbox" value="Character-Limit">
            <label for="limit">Set Character Limit</label>
            <input type="number" id="limit-value">
          </div>
        </div>
      </div>
    </form>

    <!-- box  -->

    <div class="boxes">
      <div class="box total-characters">
        <h1 class="total-box">0</h1>
        <p>Total Characters</p>
      </div>
      <div class="box word-count">
        <h1 class="word-box">0</h1>
        <p>Word Count</p>
      </div>
      <div class="box sentence-count">
        <h1 class="sentence-box">0</h1>
        <p>Sentence Count</p>
      </div>
    </div>
    <div class="density">
      <h2>Letter Density</h2>
      <p class="no-character">No characters found. Start typing to see letter density.</p>
      <div class="densities">
      </div>
      <h3 class="see-more">See More <i class="fa-solid fa-caret-down"></i></h3>
      <h3 class="see-less">See Less <i class="fa-solid fa-caret-up"></i></h3>
    </div>
  </main>





  <script src="app.js"></script>

</body>

</html>
